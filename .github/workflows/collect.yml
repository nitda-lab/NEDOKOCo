name: collect-worlds

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VRC_USERNAME: ${{ secrets.VRC_USERNAME }}
          VRC_PASSWORD: ${{ secrets.VRC_PASSWORD }}
          NANOGPT_API_KEY: ${{ secrets.NANOGPT_API_KEY }}
          NANOGPT_BASE_URL: ${{ secrets.NANOGPT_BASE_URL }}
          SCORING_MODEL: ${{ secrets.SCORING_MODEL }}
        run: python scripts/collect.py
